<svg xmlns="http://www.w3.org/2000/svg" width="696" height="656" viewBox="0 0 696 656" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
  <rect width="696" height="656" fill="#FFFFFF"/>

  <text x="24" y="32" font-size="19" font-weight="700" fill="#2D2178">Albedo Brand Palette</text>
  <text x="24" y="52" font-size="12" fill="#6E6A85">Source: assets/color pallette.png — see assets/Albedo-Color-Palette.md for RGB, CMYK and PMS values.</text>

  <!-- Core Brand -->
  <text x="24" y="88" font-size="12" font-weight="650" fill="#412DB5">CORE BRAND</text>
  <g>
    <rect x="24" y="96" width="120" height="72" rx="8" fill="#412DB5" stroke="#D9D4E2"/>
    <text x="40" y="124" font-size="13" font-weight="600" fill="#FFFFFF">Purple</text>
    <text x="40" y="146" font-size="12" font-family="Consolas, monospace" fill="#FFFFFF" opacity="0.85">#412DB5</text>

    <rect x="156" y="96" width="120" height="72" rx="8" fill="#2D2178" stroke="#D9D4E2"/>
    <text x="172" y="124" font-size="13" font-weight="600" fill="#FFFFFF">Indigo</text>
    <text x="172" y="146" font-size="12" font-family="Consolas, monospace" fill="#FFFFFF" opacity="0.85">#2D2178</text>

    <rect x="288" y="96" width="120" height="72" rx="8" fill="#E5197F" stroke="#D9D4E2"/>
    <text x="304" y="124" font-size="13" font-weight="600" fill="#FFFFFF">Razzmatazz</text>
    <text x="304" y="146" font-size="12" font-family="Consolas, monospace" fill="#FFFFFF" opacity="0.85">#E5197F</text>

    <rect x="420" y="96" width="120" height="72" rx="8" fill="#E9FF97" stroke="#D9D4E2"/>
    <text x="436" y="124" font-size="13" font-weight="600" fill="#14152A">Chartreuse</text>
    <text x="436" y="146" font-size="12" font-family="Consolas, monospace" fill="#14152A" opacity="0.7">#E9FF97</text>

    <rect x="552" y="96" width="120" height="72" rx="8" fill="#F4F4F4" stroke="#D9D4E2"/>
    <text x="568" y="124" font-size="13" font-weight="600" fill="#14152A">Light Grey</text>
    <text x="568" y="146" font-size="12" font-family="Consolas, monospace" fill="#14152A" opacity="0.7">#F4F4F4</text>
  </g>

  <!-- Space Gradient -->
  <text x="24" y="204" font-size="12" font-weight="650" fill="#412DB5">SPACE GRADIENT — dark mode surfaces</text>
  <g>
    <rect x="24" y="212" width="120" height="72" rx="8" fill="#6B7398" stroke="#D9D4E2"/>
    <text x="40" y="240" font-size="13" font-weight="600" fill="#FFFFFF">Space Light</text>
    <text x="40" y="262" font-size="12" font-family="Consolas, monospace" fill="#FFFFFF" opacity="0.85">#6B7398</text>

    <rect x="156" y="212" width="120" height="72" rx="8" fill="#35394C" stroke="#D9D4E2"/>
    <text x="172" y="240" font-size="13" font-weight="600" fill="#FFFFFF">Space Mid</text>
    <text x="172" y="262" font-size="12" font-family="Consolas, monospace" fill="#FFFFFF" opacity="0.85">#35394C</text>

    <rect x="288" y="212" width="120" height="72" rx="8" fill="#0C0E1B" stroke="#D9D4E2"/>
    <text x="304" y="240" font-size="13" font-weight="600" fill="#FFFFFF">Space Dark</text>
    <text x="304" y="262" font-size="12" font-family="Consolas, monospace" fill="#FFFFFF" opacity="0.85">#0C0E1B</text>
  </g>

  <!-- Indigo Tints -->
  <text x="24" y="320" font-size="12" font-weight="650" fill="#412DB5">INDIGO TINTS</text>
  <g>
    <rect x="24" y="328" width="120" height="72" rx="8" fill="#604DC6" stroke="#D9D4E2"/>
    <text x="40" y="356" font-size="13" font-weight="600" fill="#FFFFFF">Indigo 300</text>
    <text x="40" y="378" font-size="12" font-family="Consolas, monospace" fill="#FFFFFF" opacity="0.85">#604DC6</text>

    <rect x="156" y="328" width="120" height="72" rx="8" fill="#8173CC" stroke="#D9D4E2"/>
    <text x="172" y="356" font-size="13" font-weight="600" fill="#FFFFFF">Indigo 200</text>
    <text x="172" y="378" font-size="12" font-family="Consolas, monospace" fill="#FFFFFF" opacity="0.85">#8173CC</text>

    <rect x="288" y="328" width="120" height="72" rx="8" fill="#ABA2D4" stroke="#D9D4E2"/>
    <text x="304" y="356" font-size="13" font-weight="600" fill="#14152A">Indigo 100</text>
    <text x="304" y="378" font-size="12" font-family="Consolas, monospace" fill="#14152A" opacity="0.7">#ABA2D4</text>
  </g>

  <!-- Greys -->
  <text x="24" y="436" font-size="12" font-weight="650" fill="#412DB5">GREYS — light mode surfaces</text>
  <g>
    <rect x="24" y="444" width="120" height="72" rx="8" fill="#D9D4E2" stroke="#D9D4E2"/>
    <text x="40" y="472" font-size="13" font-weight="600" fill="#14152A">Space Grey</text>
    <text x="40" y="494" font-size="12" font-family="Consolas, monospace" fill="#14152A" opacity="0.7">#D9D4E2</text>

    <rect x="156" y="444" width="120" height="72" rx="8" fill="#E7E4ED" stroke="#D9D4E2"/>
    <text x="172" y="472" font-size="13" font-weight="600" fill="#14152A">Lt Space Grey</text>
    <text x="172" y="494" font-size="12" font-family="Consolas, monospace" fill="#14152A" opacity="0.7">#E7E4ED</text>

    <rect x="288" y="444" width="120" height="72" rx="8" fill="#F4F4F4" stroke="#D9D4E2"/>
    <text x="304" y="472" font-size="13" font-weight="600" fill="#14152A">Light Grey</text>
    <text x="304" y="494" font-size="12" font-family="Consolas, monospace" fill="#14152A" opacity="0.7">#F4F4F4</text>
  </g>

  <!-- Chartreuse Tints -->
  <text x="24" y="552" font-size="12" font-weight="650" fill="#412DB5">CHARTREUSE TINTS</text>
  <g>
    <rect x="24" y="560" width="120" height="72" rx="8" fill="#E9FF97" stroke="#D9D4E2"/>
    <text x="40" y="588" font-size="13" font-weight="600" fill="#14152A">Chartreuse</text>
    <text x="40" y="610" font-size="12" font-family="Consolas, monospace" fill="#14152A" opacity="0.7">#E9FF97</text>

    <rect x="156" y="560" width="120" height="72" rx="8" fill="#F7FFD8" stroke="#D9D4E2"/>
    <text x="172" y="588" font-size="13" font-weight="600" fill="#14152A">Light</text>
    <text x="172" y="610" font-size="12" font-family="Consolas, monospace" fill="#14152A" opacity="0.7">#F7FFD8</text>

    <rect x="288" y="560" width="120" height="72" rx="8" fill="#FCFFF0" stroke="#D9D4E2"/>
    <text x="304" y="588" font-size="13" font-weight="600" fill="#14152A">X-Light</text>
    <text x="304" y="610" font-size="12" font-family="Consolas, monospace" fill="#14152A" opacity="0.7">#FCFFF0</text>
  </g>
